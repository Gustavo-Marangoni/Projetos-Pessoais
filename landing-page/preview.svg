<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <!-- Fundo gradiente azul escuro -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#08112B"/>
      <stop offset="100%" stop-color="#0D1E4A"/>
    </linearGradient>

    <!-- Gradiente dourado para textos e elementos -->
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#D4A843"/>
      <stop offset="100%" stop-color="#ECC96A"/>
    </linearGradient>

    <!-- Gradiente azul para orb -->
    <radialGradient id="orb1" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#2D6AF0" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#2D6AF0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb2" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#D4A843" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#D4A843" stop-opacity="0"/>
    </radialGradient>

    <!-- Filtro blur para os orbs -->
    <filter id="blur1"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="blur2"><feGaussianBlur stdDeviation="30"/></filter>
  </defs>

  <!-- Fundo -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Orbs decorativos -->
  <ellipse cx="980" cy="180" rx="320" ry="320" fill="url(#orb1)" filter="url(#blur1)"/>
  <ellipse cx="160" cy="500" rx="220" ry="220" fill="url(#orb2)" filter="url(#blur2)"/>

  <!-- Grade de linhas sutis -->
  <g opacity="0.04" stroke="#FFFFFF" stroke-width="1">
    <line x1="0"    y1="90"  x2="1200" y2="90"/>
    <line x1="0"    y1="180" x2="1200" y2="180"/>
    <line x1="0"    y1="270" x2="1200" y2="270"/>
    <line x1="0"    y1="360" x2="1200" y2="360"/>
    <line x1="0"    y1="450" x2="1200" y2="450"/>
    <line x1="0"    y1="540" x2="1200" y2="540"/>
    <line x1="100"  y1="0"   x2="100"  y2="630"/>
    <line x1="300"  y1="0"   x2="300"  y2="630"/>
    <line x1="500"  y1="0"   x2="500"  y2="630"/>
    <line x1="700"  y1="0"   x2="700"  y2="630"/>
    <line x1="900"  y1="0"   x2="900"  y2="630"/>
    <line x1="1100" y1="0"   x2="1100" y2="630"/>
  </g>

  <!-- Linha decorativa dourada lateral -->
  <rect x="80" y="140" width="3" height="350" rx="2" fill="url(#gold)" opacity="0.6"/>

  <!-- Badge superior -->
  <rect x="108" y="140" width="210" height="34" rx="17" fill="none" stroke="#D4A843" stroke-opacity="0.4" stroke-width="1.5"/>
  <text x="213" y="163" font-family="Georgia, serif" font-size="13" fill="#D4A843" text-anchor="middle" letter-spacing="2">SITES PARA ADVOGADOS</text>

  <!-- Título principal -->
  <text x="108" y="250" font-family="Georgia, serif" font-size="72" font-weight="700" fill="#FFFFFF" letter-spacing="-2">Adv</text>
  <text x="262" y="250" font-family="Georgia, serif" font-size="72" font-weight="700" fill="url(#gold)" letter-spacing="-2">Pages</text>

  <!-- Subtítulo -->
  <text x="108" y="310" font-family="Arial, sans-serif" font-size="26" font-weight="300" fill="#B8C2D4">Seu escritório merece um site que</text>
  <text x="108" y="348" font-family="Arial, sans-serif" font-size="26" font-weight="300" fill="#B8C2D4">converte visitantes em clientes.</text>

  <!-- Linha separadora -->
  <rect x="108" y="390" width="500" height="1.5" rx="1" fill="#FFFFFF" opacity="0.08"/>

  <!-- Features / bullets -->
  <circle cx="126" cy="430" r="4" fill="#D4A843"/>
  <text x="144" y="436" font-family="Arial, sans-serif" font-size="18" fill="#8A9499">Design exclusivo para seu nicho</text>

  <circle cx="126" cy="468" r="4" fill="#D4A843"/>
  <text x="144" y="474" font-family="Arial, sans-serif" font-size="18" fill="#8A9499">Entrega rápida com suporte incluído</text>

  <circle cx="126" cy="506" r="4" fill="#D4A843"/>
  <text x="144" y="512" font-family="Arial, sans-serif" font-size="18" fill="#8A9499">Otimizado para captar clientes</text>

  <!-- Preço / CTA box -->
  <rect x="750" y="350" width="360" height="160" rx="20" fill="#0D1E4A" stroke="#D4A843" stroke-opacity="0.3" stroke-width="1.5"/>
  <text x="930" y="410" font-family="Arial, sans-serif" font-size="15" fill="#8A9499" text-anchor="middle" letter-spacing="1">A PARTIR DE</text>
  <text x="930" y="465" font-family="Georgia, serif" font-size="58" font-weight="700" fill="url(#gold)" text-anchor="middle" letter-spacing="-1">R$ 500</text>

  <!-- Rodapé -->
  <rect x="0" y="590" width="1200" height="40" fill="#060812" opacity="0.6"/>
  <text x="108" y="616" font-family="Arial, sans-serif" font-size="14" fill="#4A5470">pagelandingadv@gmail.com</text>
  <text x="600" y="616" font-family="Arial, sans-serif" font-size="14" fill="#4A5470" text-anchor="middle">instagram.com/land.ingpagesadv</text>
  <text x="1092" y="616" font-family="Arial, sans-serif" font-size="14" fill="#4A5470" text-anchor="end">+55 (44) 99943-0735</text>
</svg>
